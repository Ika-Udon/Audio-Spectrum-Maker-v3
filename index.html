<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波形メーカー v3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS Custom Properties (Theme) ===== */
        :root {
            --accent: #dc2626;
            --accent-hover: #b91c1c;
            --accent-glow: rgba(220, 38, 38, 0.15);
        }

        /* --- Dark theme (default) --- */
        [data-theme="dark"] {
            --bg-body: #0a0a0b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --bg-hover: #27272a;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.15);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --canvas-bg: #18181b;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --progress-bg: #27272a;
        }

        /* --- Light theme --- */
        [data-theme="light"] {
            --bg-body: #fafafa;
            --bg-card: #ffffff;
            --bg-input: #f4f4f5;
            --bg-hover: #f4f4f5;
            --border: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.15);
            --text-primary: #0a0a0b;
            --text-secondary: #71717a;
            --text-muted: #a1a1aa;
            --canvas-bg: #f4f4f5;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --progress-bg: #e4e4e7;
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Layout ===== */
        .app {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .app-body {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            align-items: flex-start;
        }

        .left-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .right-column {
            flex: 1.2;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (max-width: 900px) {
            .app-body {
                flex-direction: column;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .app {
                gap: 1rem;
            }
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.5rem;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .header h1 span {
            color: var(--accent);
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 999px;
            width: 40px;
            height: 24px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--border-focus);
        }

        .theme-toggle::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-primary);
            transition: transform 0.2s ease;
        }

        [data-theme="light"] .theme-toggle::after {
            transform: translateX(16px);
        }

        /* ===== Card ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--border-focus);
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }

        /* ===== Drop Zone ===== */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            background: var(--bg-input);
            transition: all 0.2s ease;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .drop-zone-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.8;
        }

        .drop-zone-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .drop-zone-text strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .file-name {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
            word-break: break-all;
        }

        input[type="file"] {
            display: none;
        }

        /* ===== Settings Grid ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.875rem;
        }

        @media (max-width: 480px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .setting-item label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .setting-item input[type="number"],
        .setting-item select {
            width: 100%;
            padding: 0.5rem 0.625rem;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .setting-item input[type="number"]:focus,
        .setting-item select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .setting-item input[type="color"] {
            width: 100%;
            height: 36px;
            padding: 2px;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .setting-item input[type="color"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ===== Format Radio ===== */
        .format-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .format-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
            color: var(--text-primary);
            padding: 0.375rem 0.75rem;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .format-option:hover {
            border-color: var(--border-focus);
        }

        .format-option input[type="radio"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .format-option:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ===== Generate Button ===== */
        .btn-generate {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.2);
        }

        .btn-generate:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }

        .btn-generate:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== Progress ===== */
        .progress-area {
            display: none;
        }

        .progress-area.active {
            display: block;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.2s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            text-align: center;
        }

        /* ===== Canvas ===== */
        .preview-canvas {
            width: 100%;
            height: 200px;
            background: var(--canvas-bg);
            border-radius: 10px;
            display: block;
            transition: background 0.3s ease;
        }

        /* ===== Audio Player ===== */
        #previewAudio {
            width: 100%;
            margin-top: 1rem;
            display: none;
            border-radius: 999px;
        }

        /* ===== Status ===== */
        .status-msg {
            font-size: 0.8125rem;
            text-align: center;
            color: var(--text-secondary);
            min-height: 1.2em;
            padding: 0.5rem;
            border-radius: 8px;
        }

        .status-msg.success {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .status-msg.error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* ===== Scratch Preview ===== */
        .scratch-preview-iframe {
            width: 100%;
            aspect-ratio: 4 / 3;
            border: none;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        .scratch-preview-placeholder {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 10px;
            background: var(--canvas-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* ===== Collapsible Settings ===== */
        .settings-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0;
            transition: color 0.2s ease;
        }

        .settings-toggle:hover {
            color: var(--accent);
        }

        .settings-toggle .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 0.625rem;
        }

        .settings-toggle.open .arrow {
            transform: rotate(90deg);
        }

        .settings-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .settings-body.open {
            max-height: 900px;
        }
    </style>
</head>

<body data-theme="dark">

    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1>波形メーカー <span>v3</span></h1>
            <button class="theme-toggle" id="themeToggle" aria-label="テーマ切替"></button>
        </div>

        <!-- 2カラム本体 -->
        <div class="app-body">
            <!-- 左カラム: 設定・出力系 -->
            <div class="left-column">
                <!-- ファイル選択 -->
                <div class="card">
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-icon">🎵</div>
                        <div class="drop-zone-text">
                            音声ファイルを<strong>ドラッグ&ドロップ</strong><br>
                            またはクリックして選択
                        </div>
                        <div class="file-name" id="fileName"></div>
                    </div>
                    <input type="file" id="audioFile"
                        accept="audio/mpeg, audio/wav, audio/ogg, audio/flac, audio/aac, .mp3, .wav, .ogg, .flac, .aac, .m4a, .opus, .aiff">
                </div>

                <!-- 詳細設定 (デフォルトで展開) -->
                <div class="card">
                    <button class="settings-toggle open" id="settingsToggle">
                        <span class="arrow">▶</span> 詳細設定
                    </button>
                    <div class="settings-body open" id="settingsBody">
                        <div style="height:0.75rem"></div>
                        <div class="settings-grid">
                            <div class="setting-item">
                                <label for="minFreq">最小周波数 (Hz)</label>
                                <input type="number" id="minFreq" value="20" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="maxFreq">最大周波数 (Hz)</label>
                                <input type="number" id="maxFreq" value="24000" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="numBars">バーの数</label>
                                <input type="number" id="numBars" value="480" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="barThickness">棒の太さ</label>
                                <input type="number" id="barThickness" value="5" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="barHeightScale">高さスケール</label>
                                <input type="number" id="barHeightScale" value="0.5" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="attack">アタック</label>
                                <input type="number" id="attack" value="0.6" min="0" max="1" step="0.01">
                            </div>
                            <div class="setting-item">
                                <label for="decay">ディケイ</label>
                                <input type="number" id="decay" value="0.6" min="0" max="1" step="0.01">
                            </div>
                            <div class="setting-item">
                                <label for="peakBrightness">ピーク輝度</label>
                                <input type="number" id="peakBrightness" value="1.0" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="smoothCurve">スムースカーブ</label>
                                <input type="number" id="smoothCurve" value="2.5" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="freqCompensation">周波数補正 (0-2)</label>
                                <input type="number" id="freqCompensation" value="2" min="0" max="2" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="fps">FPS</label>
                                <input type="number" id="fps" value="60" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="samplingInterval">サンプリング間隔 (n分の1)</label>
                                <input type="number" id="samplingInterval" value="2" min="1" step="1">
                            </div>
                            <div class="setting-item">
                                <label for="barColor">バーの色</label>
                                <input type="color" id="barColor" value="#ff3165">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 記録形式 (.sb3がデフォルト) -->
                <div class="card">
                    <div class="card-title">記録形式</div>
                    <div class="format-group">
                        <label class="format-option">
                            <input type="radio" name="format" value="waveform">
                            波形データ (.txt)
                        </label>
                        <label class="format-option">
                            <input type="radio" name="format" value="sb3" checked>
                            .sb3 (Scratch)
                        </label>
                    </div>
                </div>

                <!-- 生成ボタン -->
                <button class="btn-generate" id="btnGenerate" disabled>波形を生成</button>

                <!-- プログレス -->
                <div class="card progress-area" id="progressArea">
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">準備中…</div>
                </div>

                <!-- ステータス -->
                <div class="status-msg" id="statusMsg"></div>
            </div>

            <!-- 右カラム: プレビュー系 (大きめ) -->
            <div class="right-column">
                <!-- 波形プレビュー -->
                <div class="card">
                    <div class="card-title">波形プレビュー</div>
                    <canvas class="preview-canvas" id="previewCanvas"></canvas>
                    <audio id="previewAudio" controls></audio>
                </div>

                <!-- Scratchプレビュー (常時表示) -->
                <div class="card" id="scratchPreviewCard">
                    <div class="card-title">Scratch プレビュー</div>
                    <div class="scratch-preview-placeholder" id="scratchPlaceholder">
                        出力されていません
                    </div>
                    <iframe id="scratchPreview" src="./player.html" class="scratch-preview-iframe" style="display:none;"
                        allowfullscreen allow="autoplay">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== Theme Toggle =====
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        });

        // ===== Settings Toggle =====
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsBody = document.getElementById('settingsBody');
        settingsToggle.addEventListener('click', () => {
            settingsToggle.classList.toggle('open');
            settingsBody.classList.toggle('open');
        });

        // ===== File Selection =====
        const dropZone = document.getElementById('dropZone');
        const audioFileInput = document.getElementById('audioFile');
        const fileNameEl = document.getElementById('fileName');
        const btnGenerate = document.getElementById('btnGenerate');
        let selectedFile = null;

        dropZone.addEventListener('click', () => audioFileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        audioFileInput.addEventListener('change', e => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            fileNameEl.textContent = file.name;
            btnGenerate.disabled = false;
            setStatus('');
            
            // 音源をオーディオプレイヤーにセット
            const previewAudio = document.getElementById('previewAudio');
            if (previewAudio.src) {
                URL.revokeObjectURL(previewAudio.src);
            }
            previewAudio.src = URL.createObjectURL(file);
            // previewAudio.style.display は生成完了後に設定
            globalRawFrames = []; // クリア
        }

        // ===== Status =====
        const statusMsg = document.getElementById('statusMsg');
        function setStatus(msg, type = '') {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-msg' + (type ? ' ' + type : '');
        }

        // ===== Gather Settings =====
        function getSettings() {
            return {
                minFreq: Math.max(1, parseFloat(document.getElementById('minFreq').value) || 20),
                maxFreq: Math.max(1, parseFloat(document.getElementById('maxFreq').value) || 24000),
                numBars: Math.max(1, parseInt(document.getElementById('numBars').value) || 480),
                barThickness: Math.max(1, parseInt(document.getElementById('barThickness').value) || 5),
                barHeightScale: parseFloat(document.getElementById('barHeightScale').value) || 0.5,
                attack: parseFloat(document.getElementById('attack').value) || 0.6,
                decay: parseFloat(document.getElementById('decay').value) || 0.6,
                peakBrightness: parseFloat(document.getElementById('peakBrightness').value) || 1.0,
                smoothCurve: parseFloat(document.getElementById('smoothCurve').value) || 2.5,
                freqCompensation: parseFloat(document.getElementById('freqCompensation').value) || 2,
                fps: Math.max(1, parseInt(document.getElementById('fps').value) || 60),
                samplingInterval: Math.max(1, parseInt(document.getElementById('samplingInterval').value) || 2),
                barColor: document.getElementById('barColor').value
            };
        }

        // ===== Hex to HSL =====
        function hexToHsl(hex) {
            let r = parseInt(hex.substring(1, 3), 16) / 255;
            let g = parseInt(hex.substring(3, 5), 16) / 255;
            let b = parseInt(hex.substring(5, 7), 16) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }

        // ===== エンコード用ルックアップテーブル (事前生成) =====
        const ENCODE_LOOKUP = (() => {
            const table = new Array(53);
            table[0] = '"'; table[1] = '#'; table[2] = '$';
            table[3] = '%'; table[4] = '&'; table[5] = "'";
            table[6] = '('; table[7] = ')'; table[8] = '=';
            table[9] = '^'; table[10] = '!';
            for (let i = 11; i <= 36; i++) table[i] = String.fromCharCode(96 + i - 10);
            for (let i = 37; i <= 52; i++) table[i] = String.fromCharCode(64 + i - 36);
            return table;
        })();

        // ===== フレームを数値インデックス配列にエンコード =====
        function encodeFrameNumeric(barHeights, interval) {
            const count = Math.ceil(barHeights.length / interval);
            const indices = new Uint8Array(count);
            let idx = 0;
            for (let i = 0; i < barHeights.length; i += interval) {
                indices[idx++] = Math.min(Math.round(Math.floor(Math.min(barHeights[i], 315) / 2) / 3), 52);
            }
            return indices;
        }

        // ===== 数値配列を文字列に変換 =====
        function numericToString(indices) {
            const chars = new Array(indices.length);
            for (let i = 0; i < indices.length; i++) {
                chars[i] = ENCODE_LOOKUP[indices[i]];
            }
            const line = chars.join('');
            // 全無音フレーム → 空文字列
            return /^"+$/.test(line.trim()) ? '' : line;
        }

        // ===== 互換用: 従来のencodeFrame (内部でルックアップ使用) =====
        function encodeFrame(barHeights, interval) {
            return numericToString(encodeFrameNumeric(barHeights, interval));
        }

        // ===== Draw Preview =====
        const previewCanvas = document.getElementById('previewCanvas');
        let globalRawFrames = [];
        let globalSettings = null;

        function drawPreview(barHeights, settings) {
            if (!barHeights) return;
            const canvas = previewCanvas;
            canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
            canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1);
            const ctx = canvas.getContext('2d');
            ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;

            ctx.clearRect(0, 0, w, h);

            const numBars = barHeights.length;
            const spacing = w / numBars;
            const thickness = Math.max(1, Math.min(settings.barThickness, spacing));
            const hsl = hexToHsl(settings.barColor);
            const hue = hsl[0];

            for (let i = 0; i < numBars; i++) {
                const barH = Math.min(barHeights[i] * settings.barHeightScale, h);
                const x = i * spacing + (spacing - thickness) / 2;
                const normalizedH = barH / h;
                const midL = 50;
                const minL = Math.max(0, midL * (1 - settings.peakBrightness / 2));
                const lightness = Math.max(0, Math.min(100, minL + (midL - minL) * normalizedH));
                ctx.fillStyle = `hsl(${hue}, 100%, ${lightness}%)`;
                ctx.fillRect(x, h - barH, thickness, barH);
            }
        }

        // ===== プレビューオーディオの同期処理 =====
        const previewAudio = document.getElementById('previewAudio');
        function updatePreviewFromAudio() {
            if (!globalRawFrames || globalRawFrames.length === 0 || !globalSettings) return;
            const time = previewAudio.currentTime;
            const frame = Math.floor(time * globalSettings.fps);
            if (frame >= 0 && frame < globalRawFrames.length) {
                drawPreview(globalRawFrames[frame], globalSettings);
            }
        }

        function rafLoop() {
            if (!previewAudio.paused) {
                updatePreviewFromAudio();
                requestAnimationFrame(rafLoop);
            }
        }

        previewAudio.addEventListener('play', () => {
            requestAnimationFrame(rafLoop);
        });
        previewAudio.addEventListener('timeupdate', () => {
            if (previewAudio.paused) updatePreviewFromAudio(); // シーク時などの更新用
        });
        previewAudio.addEventListener('seeked', updatePreviewFromAudio);

        // ===== Offline FFT Processing (Cross-device consistent) =====
        async function generateWaveform() {
            const settings = getSettings();
            const format = document.querySelector('input[name="format"]:checked').value;

            btnGenerate.disabled = true;
            const progressArea = document.getElementById('progressArea');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressArea.classList.add('active');
            progressFill.style.width = '0%';
            progressText.textContent = 'デコード中…';
            setStatus('');

            try {
                // 1. Read file as ArrayBuffer
                const arrayBuffer = await selectedFile.arrayBuffer();

                // 2. Decode audio - use a standard sample rate for cross-device consistency
                const STANDARD_SAMPLE_RATE = 44100;
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: STANDARD_SAMPLE_RATE });
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
                await tempCtx.close();

                const sampleRate = STANDARD_SAMPLE_RATE;
                const duration = audioBuffer.duration;
                const totalFrames = Math.ceil(duration * settings.fps);
                const frameDuration = 1 / settings.fps;

                progressText.textContent = `処理中… 0/${totalFrames} フレーム`;

                // 3. Resample to standard rate to ensure cross-device consistency
                //    We'll create a mono mixdown buffer at the standard sample rate
                const totalSamples = Math.ceil(duration * sampleRate);
                const monoData = new Float32Array(totalSamples);
                const channels = audioBuffer.numberOfChannels;

                // Create an offline context at the standard sample rate for consistent resampling
                const resampleCtx = new OfflineAudioContext(1, totalSamples, sampleRate);
                const resampleSource = resampleCtx.createBufferSource();
                resampleSource.buffer = audioBuffer;
                resampleSource.connect(resampleCtx.destination);
                resampleSource.start(0);
                const resampledBuffer = await resampleCtx.startRendering();
                const resampledData = resampledBuffer.getChannelData(0);

                // 4. Process each frame using manual FFT (consistent across devices)
                const fftSize = 8192;
                const smoothingPoints = settings.numBars * 4;
                let smoothedData = new Float64Array(smoothingPoints);
                let smoothedInitialized = false;

                // フレームデータを事前確保した配列に格納
                const recordedNumeric = new Array(totalFrames);
                globalRawFrames = new Array(totalFrames); // 生波形データも保存
                let frameIdx = 0;
                let lastBarHeights = null;

                const logMinFreq = Math.log(settings.minFreq);
                const logMaxFreq = Math.log(settings.maxFreq);
                const logRange = logMaxFreq - logMinFreq;
                const halfFFT = fftSize / 2;

                // Hann window (precomputed)
                const hannWindow = new Float64Array(fftSize);
                for (let i = 0; i < fftSize; i++) {
                    hannWindow[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (fftSize - 1)));
                }

                // Process frames in chunks to keep UI responsive
                const CHUNK_SIZE = 50;
                for (let frameStart = 0; frameStart < totalFrames; frameStart += CHUNK_SIZE) {
                    const frameEnd = Math.min(frameStart + CHUNK_SIZE, totalFrames);

                    for (let frame = frameStart; frame < frameEnd; frame++) {
                        const time = frame * frameDuration;
                        const centerSample = Math.floor(time * sampleRate);

                        // Extract windowed samples
                        const windowedSamples = new Float64Array(fftSize);
                        const startSample = centerSample - Math.floor(fftSize / 2);
                        for (let i = 0; i < fftSize; i++) {
                            const idx = startSample + i;
                            const sample = (idx >= 0 && idx < resampledData.length) ? resampledData[idx] : 0;
                            windowedSamples[i] = sample * hannWindow[i];
                        }

                        // FFT (Cooley-Tukey radix-2)
                        const { real, imag } = fft(windowedSamples);

                        // Compute magnitude spectrum (similar to getByteFrequencyData)
                        const magnitudes = new Float64Array(halfFFT);
                        for (let i = 0; i < halfFFT; i++) {
                            const mag = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]) / halfFFT;
                            // Convert to dB and then to 0-255 scale (like AnalyserNode)
                            const db = 20 * Math.log10(Math.max(mag, 1e-10));
                            // AnalyserNode uses minDecibels=-100, maxDecibels=-30 by default
                            const minDb = -100, maxDb = -30;
                            const normalized = (db - minDb) / (maxDb - minDb);
                            magnitudes[i] = Math.max(0, Math.min(255, normalized * 255));
                        }

                        // Interpolate to logarithmic frequency scale
                        const currentInterpolated = new Float64Array(smoothingPoints);
                        for (let i = 0; i < smoothingPoints; i++) {
                            const logRatio = i / (smoothingPoints - 1);
                            const virtualFreq = Math.exp(logMinFreq + logRatio * logRange);
                            const idxFloat = virtualFreq * fftSize / sampleRate;
                            const idxFloor = Math.floor(idxFloat);
                            const idxCeil = Math.ceil(idxFloat);

                            if (idxFloor < 0 || idxCeil >= halfFFT) {
                                currentInterpolated[i] = 0;
                            } else if (idxFloor === idxCeil) {
                                currentInterpolated[i] = magnitudes[idxFloor];
                            } else {
                                const frac = idxFloat - idxFloor;
                                currentInterpolated[i] = magnitudes[idxFloor] * (1 - frac) + magnitudes[idxCeil] * frac;
                            }
                        }

                        // Attack/Decay smoothing
                        if (!smoothedInitialized) {
                            for (let i = 0; i < smoothingPoints; i++) smoothedData[i] = currentInterpolated[i];
                            smoothedInitialized = true;
                        } else {
                            for (let i = 0; i < smoothingPoints; i++) {
                                const target = currentInterpolated[i];
                                const current = smoothedData[i];
                                if (target > current) {
                                    smoothedData[i] = current * settings.attack + target * (1 - settings.attack);
                                } else {
                                    smoothedData[i] = current * settings.decay + target * (1 - settings.decay);
                                }
                            }
                        }

                        // Smooth curve (moving average)
                        if (settings.smoothCurve > 0) {
                            const temp = new Float64Array(smoothingPoints);
                            const windowSize = Math.min(Math.round(settings.smoothCurve * 10), Math.floor(smoothingPoints / 2));
                            const halfWin = Math.floor(windowSize / 2);
                            for (let i = 0; i < smoothingPoints; i++) {
                                let sum = 0, count = 0;
                                for (let j = -halfWin; j <= halfWin; j++) {
                                    const idx = i + j;
                                    if (idx >= 0 && idx < smoothingPoints) { sum += smoothedData[idx]; count++; }
                                }
                                temp[i] = sum / count;
                            }
                            const blend = Math.min(1, settings.smoothCurve / 3);
                            for (let i = 0; i < smoothingPoints; i++) {
                                smoothedData[i] = smoothedData[i] * (1 - blend) + temp[i] * blend;
                            }
                        }

                        // Calculate bar heights
                        const barHeights = new Float64Array(settings.numBars);
                        for (let i = 0; i < settings.numBars; i++) {
                            const spStart = Math.floor((i / settings.numBars) * smoothingPoints);
                            const spEnd = Math.ceil(((i + 1) / settings.numBars) * smoothingPoints);
                            let sum = 0, count = 0;
                            for (let j = spStart; j < spEnd; j++) {
                                if (j >= 0 && j < smoothingPoints) { sum += smoothedData[j]; count++; }
                            }
                            let bh = count > 0 ? (sum / count) * settings.barHeightScale : 0;
                            if (settings.freqCompensation > 0) {
                                const pos = i / (settings.numBars - 1);
                                bh *= 1 + (pos * settings.freqCompensation);
                            }
                            barHeights[i] = bh;
                        }

                        lastBarHeights = Array.from(barHeights);
                        globalRawFrames[frameIdx] = lastBarHeights; // 再生同期用に保存
                        // 数値インデックスとして直接エンコード（中間文字列を回避）
                        const intHeights = new Float64Array(barHeights.length);
                        for (let k = 0; k < barHeights.length; k++) intHeights[k] = Math.floor(barHeights[k]);
                        recordedNumeric[frameIdx++] = encodeFrameNumeric(intHeights, settings.samplingInterval);
                    }

                    // Update progress
                    const pct = Math.min(100, Math.round((frameEnd / totalFrames) * 100));
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `処理中… ${frameEnd}/${totalFrames} フレーム (${pct}%)`;

                    // Yield to UI
                    await new Promise(r => setTimeout(r, 0));
                }

                // 5. Draw preview of last frame
                if (lastBarHeights) {
                    drawPreview(lastBarHeights, settings);
                }

                progressText.textContent = 'エンコード中…';
                await new Promise(r => setTimeout(r, 0));

                // 6. 数値配列を文字列に一括変換
                const encodedLines = new Array(totalFrames);
                for (let i = 0; i < totalFrames; i++) {
                    encodedLines[i] = numericToString(recordedNumeric[i]);
                }

                // エンコード完了後にプレイヤーを表示・設定保存
                globalSettings = settings;

                // 7. Save
                if (format === 'waveform') {
                    const header = `?,${settings.numBars},${settings.barThickness},${settings.barHeightScale},${settings.fps},${settings.barColor}`;
                    const output = header + '\n' + encodedLines.join('\n');
                    downloadBlob(new Blob([output], { type: 'text/plain' }), 'spectrum_data.txt');
                    setStatus('✅ spectrum_data.txt をダウンロードしました', 'success');
                } else if (format === 'sb3') {
                    await saveSb3(encodedLines, settings);
                }

                progressFill.style.width = '100%';
                progressText.textContent = '完了！';

            } catch (err) {
                console.error(err);
                setStatus('❌ エラー: ' + err.message, 'error');
                progressText.textContent = 'エラーが発生しました';
            } finally {
                btnGenerate.disabled = false;
            }
        }

        // ===== FFT (Cooley-Tukey radix-2 DIT) =====
        function fft(input) {
            const N = input.length;
            const real = new Float64Array(N);
            const imag = new Float64Array(N);

            // Bit-reversal permutation
            for (let i = 0; i < N; i++) {
                real[bitReverse(i, N)] = input[i];
            }

            // Butterfly computation
            for (let size = 2; size <= N; size *= 2) {
                const halfSize = size / 2;
                const angleStep = -2 * Math.PI / size;
                for (let i = 0; i < N; i += size) {
                    for (let j = 0; j < halfSize; j++) {
                        const angle = angleStep * j;
                        const tpRe = Math.cos(angle) * real[i + j + halfSize] - Math.sin(angle) * imag[i + j + halfSize];
                        const tpIm = Math.cos(angle) * imag[i + j + halfSize] + Math.sin(angle) * real[i + j + halfSize];
                        real[i + j + halfSize] = real[i + j] - tpRe;
                        imag[i + j + halfSize] = imag[i + j] - tpIm;
                        real[i + j] += tpRe;
                        imag[i + j] += tpIm;
                    }
                }
            }
            return { real, imag };
        }

        function bitReverse(x, N) {
            const bits = Math.log2(N);
            let result = 0;
            for (let i = 0; i < bits; i++) {
                result = (result << 1) | (x & 1);
                x >>= 1;
            }
            return result;
        }

        // ===== Download Helper =====
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ===== SB3 Export =====
        let baseSb3Content = null;
        async function loadBaseSb3() {
            if (baseSb3Content) return true;
            try {
                const response = await fetch('https://raw.githubusercontent.com/Ika-Udon/AudioSpectrum/main/%E6%8A%9C%E3%81%91%E6%AE%BB.sb3');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                baseSb3Content = await response.arrayBuffer();
                return true;
            } catch (err) {
                console.error('Failed to load base sb3:', err);
                return false;
            }
        }

        async function saveSb3(encodedLines, settings) {
            const progressText = document.getElementById('progressText');
            progressText.textContent = '.sb3 テンプレートを読み込み中…';

            if (!await loadBaseSb3()) {
                setStatus('❌ .sb3テンプレートの読み込みに失敗しました', 'error');
                return;
            }

            progressText.textContent = '.sb3 を構築中…';
            await new Promise(r => setTimeout(r, 0));

            const jszipModule = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
            const JSZip = jszipModule.default || jszipModule.JSZip || window.JSZip;

            if (!JSZip || typeof JSZip.loadAsync !== 'function') {
                setStatus('❌ JSZipの読み込みに失敗しました', 'error');
                return;
            }

            const zip = await JSZip.loadAsync(new Blob([baseSb3Content]));
            let projectJsonStr = await zip.file('project.json').async('text');
            projectJsonStr = projectJsonStr.replace(/音源/g, selectedFile.name);
            const projectJson = JSON.parse(projectJsonStr);

            const stageTarget = projectJson.targets.find(t => t.isStage);
            if (!stageTarget) {
                setStatus('❌ ステージターゲットが見つかりません', 'error');
                return;
            }

            if (!stageTarget.lists) stageTarget.lists = {};
            let listId = Object.keys(stageTarget.lists).find(k => stageTarget.lists[k][0] === '#スペクトラムデータ');
            if (!listId) {
                listId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
                stageTarget.lists[listId] = ['#スペクトラムデータ', []];
            }

            const header = `?,${settings.numBars},${settings.barThickness},${settings.barHeightScale},${settings.fps},${settings.barColor}`;
            stageTarget.lists[listId][1] = [header, ...encodedLines];

            zip.file('project.json', JSON.stringify(projectJson));
            const audioArrayBuffer = await selectedFile.arrayBuffer();
            zip.file('663a96719183b9aa6e9c010d161487c5.mp3', audioArrayBuffer);

            const sb3ArrayBuffer = await zip.generateAsync({ type: 'arraybuffer' });
            downloadBlob(new Blob([sb3ArrayBuffer]), 'audio_spectrum.sb3');
            setStatus('✅ audio_spectrum.sb3 をダウンロードしました', 'success');

            // Scratch プレビューに送る
            sendToPlayer(sb3ArrayBuffer);
        }

        // ===== Scratch Player =====
        const scratchPreviewCard = document.getElementById('scratchPreviewCard');
        const scratchPreview = document.getElementById('scratchPreview');
        const scratchPlaceholder = document.getElementById('scratchPlaceholder');
        let playerReady = false;
        let pendingSb3 = null;

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'ready') {
                playerReady = true;
                if (pendingSb3) {
                    scratchPreview.contentWindow.postMessage({ type: 'load', data: pendingSb3 }, '*');
                    pendingSb3 = null;
                }
            }
        });

        function sendToPlayer(arrayBuffer) {
            // Scratchプレビューカードは常時表示なのでdisplay操作不要
            scratchPlaceholder.style.display = 'none';
            scratchPreview.style.display = 'block';
            if (playerReady) {
                scratchPreview.contentWindow.postMessage({ type: 'load', data: arrayBuffer }, '*');
            } else {
                pendingSb3 = arrayBuffer;
            }
        }

        // ===== Button Event =====
        btnGenerate.addEventListener('click', generateWaveform);

        // ===== Canvas Resize =====
        function resizePreviewCanvas() {
            const canvas = previewCanvas;
            canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1);
            canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1);
        }
        window.addEventListener('resize', resizePreviewCanvas);
        window.addEventListener('load', resizePreviewCanvas);
    </script>
